# ============================================================================
# Crystal Finance - Container Configuration
# ============================================================================
# Services: MySQL Database → C# Web API
# All services are on the 'finance-network' bridge network.
# Environment variables are loaded from the repository root .env file.
# ============================================================================

services:
  mysql:
    image: mysql:8
    container_name: finance-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"

    volumes:
      - finance_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - finance-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD -e 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-api:
    build:
      context: .
      dockerfile: ./src/CrystalFinance.Api/Dockerfile

    container_name: finance-api

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      - AzureAd__Instance=${AZURE_AD_INSTANCE}
      - AzureAd__TenantId=${AZURE_AD_TENANT_ID}
      - AzureAd__ClientId=${AZURE_AD_CLIENT_ID}
      - AzureAd__ClientSecret=${AZURE_AD_CLIENT_SECRET}
      - AzureAd__Scopes=${AZURE_AD_SCOPES}
      - AzureAd__AuthorizationUrl=${AZURE_AD_AUTHORIZATION_URL}
      - AzureAd__TokenUrl=${AZURE_AD_TOKEN_URL}
      - AzureAd__AuthorityUrl=${AZURE_AD_AUTHORITY_URL}
      - AzureAd__ApplicationIdUri=${AZURE_AD_APPLICATION_ID_URI}
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=${MYSQL_DATABASE};Uid=${MYSQL_USER};Pwd=${MYSQL_PASSWORD};
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080

    ports:
      - "${API_HOST_PORT:-8080}:8080"

    networks:
      - finance-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  finance_data:
    driver: local

networks:
  finance-network:
    driver: bridge
